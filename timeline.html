<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f3f0e9">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'self'; base-uri 'none'">
  <title>受限内容</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f0e9;
      --ink: #1b1b19;
      --muted: #6e6b65;
      --line: #cbc5b9;
      --accent: #963f32;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 30rem);
      margin: auto;
      padding: max(32px, env(safe-area-inset-top)) 24px max(40px, env(safe-area-inset-bottom));
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 650;
      letter-spacing: .12em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 13vw, 4.4rem);
      font-weight: 520;
      letter-spacing: -.055em;
      line-height: .96;
    }

    .intro {
      max-width: 27rem;
      margin: 22px 0 32px;
      color: var(--muted);
      font-size: .95rem;
      line-height: 1.7;
    }

    form {
      border-top: 1px solid var(--ink);
      padding-top: 22px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 650;
      letter-spacing: .08em;
    }

    .field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      border-bottom: 1px solid var(--ink);
    }

    input,
    button {
      min-height: 52px;
      border: 0;
      border-radius: 0;
      font: inherit;
    }

    input {
      min-width: 0;
      padding: 0 12px 0 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 1.15rem;
      letter-spacing: .08em;
    }

    input::placeholder { color: #aaa59b; }

    button {
      padding: 0 2px 0 20px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-weight: 650;
    }

    button:disabled { cursor: wait; opacity: .5; }

    .status {
      min-height: 1.5em;
      margin: 12px 0 0;
      color: var(--accent);
      font-size: .78rem;
    }

    .privacy {
      margin: 42px 0 0;
      color: var(--muted);
      font-size: .72rem;
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Restricted / 受限内容</p>
    <h1>访问验证</h1>
    <p class="intro">请输入访问密码。验证完成前，本页不会显示正文。</p>

    <form id="unlock-form">
      <label for="password">访问密码</label>
      <div class="field">
        <input id="password" name="password" type="password" inputmode="numeric" autocomplete="current-password" required autofocus aria-describedby="status">
        <button type="submit">进入</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="privacy">请勿转发访问密码或页面内容。</p>
  </main>

      iterations: 600000
    });

    const form = document.querySelector("#unlock-form");
    const passwordInput = document.querySelector("#password");
    const submitButton = form.querySelector("button");
    const status = document.querySelector("#status");
    const decoder = new TextDecoder();
    const encoder = new TextEncoder();

    function fromBase64(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, (character) => character.charCodeAt(0));
    }

    async function deriveKey(password) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          hash: "SHA-256",
          salt: fromBase64(payload.salt),
          iterations: payload.iterations
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      passwordInput.disabled = true;
      status.textContent = "正在验证…";

      try {
        const key = await deriveKey(passwordInput.value);
        const plaintext = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: fromBase64(payload.iv) },
          key,
          fromBase64(payload.ciphertext)
        );
        const html = decoder.decode(plaintext);

        if (!html.toLowerCase().startsWith("<!doctype html>")) {
          throw new Error("Unexpected payload");
        }

        passwordInput.value = "";
        document.open();
        document.write(html);
        document.close();
      } catch {
        passwordInput.value = "";
        passwordInput.disabled = false;
        submitButton.disabled = false;
        status.textContent = "密码不正确";
        passwordInput.focus();
      }
    });
  </script>
