<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#efe9dc">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; connect-src 'self'; img-src blob: data:; media-src blob:; style-src 'unsafe-inline'; form-action 'self'; base-uri 'none'">
  <title>受限内容</title>
  <style>
    :root { color-scheme: light; --paper: #efe9dc; --ink: #181816; --muted: #706b61; --accent: #963f32; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; display: grid; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: Inter, "SF Pro Text", "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: min(100%, 30rem); margin: auto; padding: max(32px, env(safe-area-inset-top)) 24px max(40px, env(safe-area-inset-bottom)); }
    .eyebrow { margin: 0 0 12px; color: var(--muted); font-size: .7rem; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.6rem, 13vw, 4.4rem); font-weight: 520; letter-spacing: -.055em; line-height: .96; }
    .intro { margin: 22px 0 32px; color: var(--muted); font-size: .95rem; line-height: 1.7; }
    form { border-top: 1px solid var(--ink); padding-top: 22px; }
    label { display: block; margin-bottom: 9px; color: var(--muted); font-size: .72rem; font-weight: 650; letter-spacing: .08em; }
    .field { display: grid; grid-template-columns: minmax(0, 1fr) auto; border-bottom: 1px solid var(--ink); }
    input, button { min-height: 52px; border: 0; border-radius: 0; font: inherit; }
    input { min-width: 0; padding: 0 12px 0 0; outline: 0; background: transparent; color: var(--ink); font-size: 1.15rem; letter-spacing: .08em; }
    button { padding: 0 2px 0 20px; background: transparent; color: var(--accent); cursor: pointer; font-weight: 650; }
    button:disabled { cursor: wait; opacity: .5; }
    .status { min-height: 1.5em; margin: 12px 0 0; color: var(--accent); font-size: .78rem; line-height: 1.5; }
    .progress { display: block; width: 100%; height: 2px; margin-top: 12px; overflow: hidden; background: rgba(24,24,22,.12); opacity: 0; }
    .progress::after { content: ""; display: block; width: 35%; height: 100%; background: var(--accent); transform: translateX(-120%); }
    .progress.is-active { opacity: 1; }
    .progress.is-active::after { animation: loading 1.1s ease-in-out infinite; }
    .privacy { margin: 42px 0 0; color: var(--muted); font-size: .72rem; line-height: 1.65; }
    @keyframes loading { to { transform: translateX(330%); } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Restricted / 受限内容</p>
    <h1>访问验证</h1>
    <p class="intro">请输入访问密码。正文、索引和图片只会在浏览器中解密。</p>
    <form id="unlock-form">
      <label for="password">访问密码</label>
      <div class="field">
        <input id="password" name="password" type="password" inputmode="numeric" autocomplete="current-password" required autofocus aria-describedby="status">
        <button type="submit">进入</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <span class="progress" id="progress" aria-hidden="true"></span>
    </form>
    <p class="privacy">请勿转发访问密码或页面内容。</p>
  </main>
  <script>
    (() => {
      "use strict";
      const config = Object.freeze({
        salt: "+rSQ4WjmXwPnhLq9BWGAIQ==",
        mainIv: "Q2E43IaumeBQZmzX",
        mainFile: "payload/089d83448815e98bc0163ea094379994.bin",
        iterations: 600000,
        sourceDigest: "71bb86cd56934321994986a460727ebcdaf7cada15c3074754a392b16b103450",
        additionalData: "private-timeline-app-v1"
      });
      const encoder = new TextEncoder();
      const decoder = new TextDecoder();
      const form = document.querySelector("#unlock-form");
      const passwordInput = document.querySelector("#password");
      const submitButton = form.querySelector("button");
      const status = document.querySelector("#status");
      const progress = document.querySelector("#progress");

      function fromBase64(value) {
        const binary = atob(value);
        return Uint8Array.from(binary, (character) => character.charCodeAt(0));
      }

      async function deriveKey(password) {
        const material = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", hash: "SHA-256", salt: fromBase64(config.salt), iterations: config.iterations },
          material,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
      }

      async function decrypt(key, encrypted, iv, additionalData) {
        return crypto.subtle.decrypt(
          { name: "AES-GCM", iv: fromBase64(iv), ...(additionalData ? { additionalData: encoder.encode(additionalData) } : {}) },
          key,
          encrypted
        );
      }

      function execute(source, label) {
        const script = document.createElement("script");
        script.textContent = source + "\n//# sourceURL=" + label;
        document.body.append(script);
      }

      function installSecureAssets(key, manifest) {
        const urls = new Map();
        async function load(path) {
          if (urls.has(path)) return urls.get(path);
          const promise = (async () => {
            const entry = manifest[path];
            if (!entry) throw new Error("Encrypted asset not found: " + path);
            const response = await fetch(entry.file, { cache: "force-cache" });
            if (!response.ok) throw new Error("Encrypted asset request failed: " + response.status);
            const plaintext = await decrypt(key, await response.arrayBuffer(), entry.iv, path);
            return URL.createObjectURL(new Blob([plaintext], { type: entry.mime }));
          })();
          urls.set(path, promise);
          return promise;
        }

        const observer = "IntersectionObserver" in window
          ? new IntersectionObserver((entries) => {
              entries.forEach((entry) => {
                if (!entry.isIntersecting) return;
                observer.unobserve(entry.target);
                hydrate(entry.target);
              });
            }, { rootMargin: "600px 0px" })
          : null;

        async function hydrate(image) {
          const assetPath = image.dataset.secureSrc;
          if (!assetPath || image.dataset.secureLoading) return;
          image.dataset.secureLoading = "true";
          try {
            image.src = await load(assetPath);
            delete image.dataset.secureSrc;
          } catch (error) {
            image.alt = image.alt ? image.alt + "（图片解密失败）" : "图片解密失败";
            console.error(error);
          } finally {
            delete image.dataset.secureLoading;
          }
        }

        function scan(root) {
          const images = [];
          if (root.nodeType === Node.ELEMENT_NODE && root.matches?.("img[data-secure-src]")) images.push(root);
          root.querySelectorAll?.("img[data-secure-src]").forEach((image) => images.push(image));
          images.forEach((image) => observer ? observer.observe(image) : hydrate(image));
        }

        new MutationObserver((mutations) => {
          mutations.forEach((mutation) => mutation.addedNodes.forEach(scan));
        }).observe(document.documentElement, { childList: true, subtree: true });

        window.__SECURE_ASSETS__ = Object.freeze({ load, scan });
        scan(document);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        passwordInput.disabled = true;
        progress.classList.add("is-active");
        status.textContent = "正在解密档案…";
        try {
          const [key, response] = await Promise.all([
            deriveKey(passwordInput.value),
            fetch(config.mainFile, { cache: "no-store" })
          ]);
          if (!response.ok) throw new Error("Encrypted application request failed: " + response.status);
          const plaintext = await decrypt(key, await response.arrayBuffer(), config.mainIv, config.additionalData);
          const archive = JSON.parse(decoder.decode(plaintext));
          if (archive.version !== 1 || !archive.bodyHtml || !archive.scripts || !archive.assets) throw new Error("Unexpected encrypted application format");

          passwordInput.value = "";
          document.title = archive.title;
          document.querySelectorAll("head style").forEach((style) => style.remove());
          const style = document.createElement("style");
          style.textContent = archive.css;
          document.head.append(style);
          document.body.innerHTML = archive.bodyHtml;
          installSecureAssets(key, archive.assets);
          archive.scripts.forEach((source, index) => execute(source, "private-timeline-" + index + ".js"));
          window.__SECURE_ASSETS__.scan(document);
        } catch (error) {
          console.error(error);
          passwordInput.value = "";
          passwordInput.disabled = false;
          submitButton.disabled = false;
          progress.classList.remove("is-active");
          status.textContent = "密码不正确，或加密档案加载失败";
          passwordInput.focus();
        }
      });
    })();
  </script>
</body>
</html>
